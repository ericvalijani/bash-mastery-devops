# argocd/bootstrap/root-bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-root
  namespace: argocd
spec:
  project: app-of-apps-project
  source:
    repoURL: https://github.com/sabermaraghi/bash-mastery-devops.git
    path: argocd/applications
    targetRevision: HEAD
    directory:
      include: root-app-of-apps.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
