# argocd/bootstrap/bootstrap-root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sabermaraghi/bash-mastery-devops.git
    targetRevision: main
    path: argocd/applications
    directory:
      include: environments-appset.yaml
      #include: root-app-of-apps.yaml
      exclude: "bootstrap-root.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
