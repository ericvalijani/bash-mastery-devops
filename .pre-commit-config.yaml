# Pre-commit configuration
#
# Two kinds of hook here:
#   - Upstream hooks: repos that publish a .pre-commit-hooks.yaml.
#   - Local hooks:    tools distributed as plain binaries (Trivy, Syft, Grype).
#                     These run only if the binary is on PATH, and are skipped
#                     with a notice otherwise, so a missing tool never silently
#                     turns into a passing check.
#
# Run everything without committing:  pre-commit run --all-files

repos:
  # 1. Gitleaks — hardcoded secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.1
    hooks:
      - id: gitleaks
        name: "[Security] Gitleaks (secret scan)"

  # 2. Semgrep — SAST for Bash, YAML, JSON, Terraform
  - repo: https://github.com/semgrep/semgrep
    rev: v1.174.0
    hooks:
      - id: semgrep
        name: "[Security] Semgrep SAST"
        # p/ci and p/secrets are real registry rulesets; there is no p/bash or
        # p/shell — an unknown ruleset makes semgrep exit 7 (invalid config).
        # Verify with: curl -sI https://semgrep.dev/c/p/NAME
        # --quiet is deliberately omitted: it suppresses config errors too.
        args: [--config=p/ci, --config=p/secrets, --error]

  # 3. Shfmt — Bash auto-format
  #    Note: the hook lives at scop/pre-commit-shfmt, not mvdan/sh (which ships
  #    the binary but publishes no pre-commit manifest).
  #    Keep this rev current: older manifests use pre-commit's deprecated
  #    stage names (commit/push) and emit a warning on every run.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        name: "[Format] Shfmt (2-space indent, indented case)"
        args: [-w, -i, "2", -ci]

  # 4. Standard hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: "[Policy] No files >500KB"
        args: [--maxkb=500]
      - id: detect-private-key
        name: "[Security] No private keys"
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        name: "[Policy] No unresolved merge conflict markers"

  # 5. Local hooks — binaries, not pre-commit repos
  - repo: local
    hooks:
      - id: shellcheck
        name: "[Lint] ShellCheck"
        entry: shellcheck
        language: system
        types: [shell]
        args: [--severity=error, --external-sources]

      - id: trivy-fs
        name: "[Security] Trivy filesystem scan"
        entry: >-
          bash -c 'command -v trivy >/dev/null ||
          { echo "SKIP - trivy not installed"; exit 0; };
          trivy fs --quiet --exit-code 1 --no-progress --severity HIGH,CRITICAL .'
        language: system
        pass_filenames: false

      - id: syft-sbom
        name: "[Supply chain] Syft SBOM generation"
        entry: >-
          bash -c 'command -v syft >/dev/null ||
          { echo "SKIP - syft not installed"; exit 0; };
          syft dir:. -o cyclonedx-json=sbom.json -q'
        language: system
        pass_filenames: false

      - id: grype-scan
        name: "[Supply chain] Grype SBOM vulnerability scan"
        entry: >-
          bash -c 'command -v grype >/dev/null ||
          { echo "SKIP - grype not installed"; exit 0; };
          [ -f sbom.json ] || { echo "SKIP - no sbom.json yet"; exit 0; };
          grype sbom:sbom.json --fail-on high -q'
        language: system
        pass_filenames: false
