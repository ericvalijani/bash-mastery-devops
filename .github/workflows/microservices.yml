name: Microservices CI/CD
on:
  push:
    paths: ['microservice/**']
jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix script permissions
        run: bash common/fix-permissions.sh

      - name: Install Tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2

      - name: Build & Secure
        run: |
          for svc in backup deploy health secret cost; do
            (
              cd microservice/$svc
              ../common/build.sh $svc
              buildah push localhost/$svc-api:latest docker-daemon:localhost/$svc-api:latest
              buildah push --tls-verify=false localhost/$svc-api:latest localhost:5000/$svc-api:latest
              syft localhost/$svc-api:latest -o cyclonedx-json > sbom-$svc.json
              cosign sign --yes localhost:5000/$svc-api:latest
              trivy image --exit-code 1 --severity HIGH,CRITICAL localhost/$svc-api:latest
            )
          done
