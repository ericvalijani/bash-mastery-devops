name: CI
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          npm install -g bats
      - name: shfmt (check)
        run: shfmt -d -i 2 -ci $(find . -name '*.sh')
      - name: shellcheck
        run: shellcheck -x --severity=error $(find . -name '*.sh')
      - name: bats
        run: bats -r days
