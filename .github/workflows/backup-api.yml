name: Backup API CI/CD

on:
  push:
    paths: ['microservice/backup/**']
  pull_request:

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Fix script permissions
        run: bash common/fix-permissions.sh
      
      - name: Build with Buildah
        run: |
          cd microservice/backup/docker
          bash ./build.sh

      - name: Load image into Docker
        run: buildah push localhost/backup-api:latest docker-daemon:localhost/backup-api:latest

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2

      - name: Push to local registry
        run: buildah push --tls-verify=false localhost/backup-api:latest localhost:5000/backup-api:latest

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft localhost/backup-api:latest -o cyclonedx-json > sbom.json

      - name: Trivy report (human-readable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost/backup-api:latest
          format: table
          severity: CRITICAL
          exit-code: 0
          trivyignores: .trivyignore

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost/backup-api:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: 1
          trivyignores: .trivyignore

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Sign with Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-version: 'v2.2.1'
      - run: cosign sign --yes localhost:5000/backup-api:latest
