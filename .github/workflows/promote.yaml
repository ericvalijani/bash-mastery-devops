# .github/workflows/promote.yaml
name: Promote via Git Tag
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Crucial for fit push

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash && sudo mv kustomize /usr/local/bin/

      - name: Promote to Production (stable tags only)
        if: "!contains(github.ref, '-rc') && !contains(github.ref, '-beta')"
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cd argocd/overlays/prod
          kustomize edit set image ghcr.io/sabermaraghi/bash-mastery-devops=ghcr.io/sabermaraghi/bash-mastery-devops:$TAG
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "release: promote $TAG to production"
          git push origin main
